# https://medium.com/@kinghuang/docker-compose-anchors-aliases-extensions-a1e4105d70bd
x-container-base: &container-base
  init: true

services:
  WSIbackend:
    <<: *container-base
    build:
      context: ./backend/openslide
      dockerfile: dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: ${WSI_VIEWER_BACKEND_IMAGE:-hkustmdi/wsi_image_viewer_backend:1.0}
    volumes:
      - ./backend/openslide/app:/app/app
      - ./images:/app/images
      - ./annotations:/app/annotations
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  WSI_frontend_builder:
    <<: *container-base
    build:
      context: ./frontend/wsi-viewer
      dockerfile: dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ${WSI_VIEWER_FRONTEND_IMAGE:-hkustmdi/wsi_image_viewer_frontend:2.0}
    environment:
      # Next.js basePath is compiled into the static export by this one-shot
      # builder. Leave empty for root deployment.
      NEXT_PUBLIC_BASE_PATH: "${WSI_VIEWER_BASE_PATH:-}"
      NEXT_PUBLIC_API_BASE: "${WSI_VIEWER_API_BASE:-}"
    volumes:
      - ./frontend/wsi-viewer:/frontend/app_to_build
      - ./nginx/html:/frontend/app/build
      - ./frontend/wsi-viewer/build_nextjs.sh:/build_nextjs.sh
    entrypoint: ["sh", "/build_nextjs.sh"]

  nginx:
    <<: *container-base
    image: ${NGINX_IMAGE:-nginx:alpine}
    depends_on:
      WSIbackend:
        condition: service_healthy
      WSI_frontend_builder:
        condition: service_completed_successfully
    ports:
      # The API has no authentication, so keep the stack local unless the
      # operator explicitly opts into a network-facing bind address.
      - "${NGINX_BIND_HOST:-127.0.0.1}:${NGINX_PORT:-8082}:80"
    volumes:
      - ./nginx:/nginx
      - ./nginx/html:/usr/share/nginx/html/
    entrypoint: ["sh", "/nginx/entry.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
